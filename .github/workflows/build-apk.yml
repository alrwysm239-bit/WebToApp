      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          PASS=webforge123
          if [ ! -f keystore/ks.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/ks.jks -alias webforge \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass $PASS -keypass $PASS \
              -dname "CN=WebForge, O=WebForge, C=SA"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore/ks.jks
            git commit -m "add signing keystore"
            git push
          fi
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" 2>/dev/null | head -1)
          if [ -n "$UNSIGNED" ]; then
            $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
            $BT/apksigner sign --ks keystore/ks.jks --ks-pass pass:$PASS \
              --ks-key-alias webforge --out WebForge.apk aligned.apk
          else
            cp "$(find android/app/build/outputs/apk -name '*.apk' | head -1)" WebForge.apk
          fi
