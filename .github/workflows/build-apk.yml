name: Build WebForge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  KS_PASS: webforge123456

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # ---------------------------------------------------------------
      # FIX 1: R.string.default_web_client_id only exists when
      # app/google-services.json exists. Patch the code so it is read at
      # runtime instead. Safe to run repeatedly, so it also works after
      # you re-export the project from Google AI Studio.
      # ---------------------------------------------------------------
      - name: Patch source (default_web_client_id)
        run: |
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("app/src/main/java/com/example/ai/GoogleAuthHelper.kt")
          if not p.exists():
              print("GoogleAuthHelper.kt not found, skipping patch")
              raise SystemExit(0)

          s = p.read_text(encoding="utf-8")
          if "R.string.default_web_client_id" not in s:
              print("Already patched, nothing to do")
              raise SystemExit(0)

          helper = '''
              private fun webClientId(context: Context): String {
                  val id = context.resources.getIdentifier("default_web_client_id", "string", context.packageName)
                  if (id == 0) throw IllegalStateException("default_web_client_id missing (google-services.json not found)")
                  return context.getString(id).also {
                      if (it.isBlank()) throw IllegalStateException("default_web_client_id is blank")
                  }
              }
          '''

          s = s.replace("context.getString(R.string.default_web_client_id)", "webClientId(context)")
          s = s.replace('private const val TAG = "Auth"\n', 'private const val TAG = "Auth"\n' + helper, 1)
          s = s.replace("if (Firebase.auth.currentUser != null) {", "if (currentUserOrNull() != null) {")
          p.write_text(s, encoding="utf-8")
          print("Patched GoogleAuthHelper.kt")
          PY

      # FIX 2: the admin dialog silently ignores a cancelled/failed Google
      # sign-in. Show a clear message instead.
      - name: Patch source (show sign-in cancel message)
        run: |
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("app/src/main/java/com/example/ui/components/AdminControlPanelDialog.kt")
          if not p.exists():
              raise SystemExit(0)
          s = p.read_text(encoding="utf-8")
          old = "onAuthCancelled = { authBusy = false },"
          new = 'onAuthCancelled = { authBusy = false; authError = "لم يكتمل تسجيل الدخول. إذا اخترت الحساب ثم رجعت الشاشة، فغالباً بصمة SHA-1 غير مضافة في Firebase." },'
          if old in s:
              p.write_text(s.replace(old, new), encoding="utf-8")
              print("Patched AdminControlPanelDialog.kt")
          else:
              print("Already patched or not found")
          PY

      # Optional: add a repo secret named GOOGLE_SERVICES_JSON (the full
      # content of google-services.json from Firebase Console) to enable
      # Google sign-in and Firestore in the built APK.
      - name: Add google-services.json (if secret exists)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > /tmp/gsj.json
            if grep -q "android_client_info" /tmp/gsj.json; then
              cp /tmp/gsj.json app/google-services.json
              echo "google-services.json added from secret"
            else
              echo "::warning::The GOOGLE_SERVICES_JSON secret does not contain an Android app (android_client_info missing). Secret ignored."
            fi
          else
            echo "No GOOGLE_SERVICES_JSON secret: using app/google-services.json if it exists in the repo"
          fi

      # FIX 3: google-services.json must contain a client whose package name
      # equals the app's applicationId. If it does not, use the package name
      # that is inside the json (so the build never fails with
      # "No matching client found for package name").
      - name: Match applicationId to google-services.json
        run: |
          python3 - <<'PY'
          import json, os, re, pathlib

          gj = pathlib.Path("app/google-services.json")
          if not gj.exists():
              print("No google-services.json, keeping applicationId")
              raise SystemExit(0)

          data = json.loads(gj.read_text(encoding="utf-8"))
          pkgs = []
          for c in data.get("client", []):
              name = c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              if name and name not in pkgs:
                  pkgs.append(name)
          print("Packages found in google-services.json:", pkgs)
          print("Number of clients in file:", len(data.get("client", [])))
          if not pkgs:
              print("::warning::google-services.json has NO Android app inside it, so it was ignored. The APK will build but Firebase login will not work. In Firebase add an Android app, then download the file again.")
              gj.unlink()
              raise SystemExit(0)

          gradle = pathlib.Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          m = re.search(r'applicationId\s*=\s*"([^"]+)"', g)
          current = m.group(1)
          if current in pkgs:
              print("applicationId already matches:", current)
              raise SystemExit(0)

          target = pkgs[0]
          g = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "%s"' % target, g, count=1)
          gradle.write_text(g, encoding="utf-8")
          print("applicationId changed from", current, "to", target)
          PY

      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Create or reuse release keystore
        run: |
          if [ ! -f keystore/ks.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/ks.jks -alias upload \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=WebForge,O=WebForge,C=SA"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore/ks.jks
            git commit -m "add signing keystore"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Set version
        run: |
          sed -i -E 's/versionCode = [0-9]+/versionCode = ${{ github.run_number }}/' app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]*"/versionName = "1.0.${{ github.run_number }}"/' app/build.gradle.kts

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/ks.jks
          STORE_PASSWORD: ${{ env.KS_PASS }}
          KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          set -o pipefail
          gradle assembleRelease -x lintVitalRelease --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee build.log

      # Shows the real cause of a failure in a short, readable form.
      - name: Show real errors on failure
        if: failure()
        run: |
          echo "=========== ERRORS ==========="
          grep -nE "^e: |^w: .*error|What went wrong|FAILED|Execution failed|Unresolved reference|Could not resolve|Caused by" build.log | head -60 || true
          echo "=========== CONTEXT ==========="
          grep -n -A 12 "What went wrong" build.log | head -60 || true

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            build.log
          if-no-files-found: ignore

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WebForge.apk

      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: WebForge-APK
          path: WebForge.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WebForge v1.0.${{ github.run_number }}
          files: WebForge.apk
